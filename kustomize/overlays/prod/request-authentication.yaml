apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: pk-bkd-ms-api-stuart
spec:
  selector:
    matchLabels:
      app: pk-bkd-ms-api-stuart
  jwtRules:
    - issuer: https://keycloak.prokicon.com/realms/stuart
      jwksUri: http://keycloak.keycloak.svc.cluster.local/realms/stuart/protocol/openid-connect/certs
      forwardOriginalToken: true
